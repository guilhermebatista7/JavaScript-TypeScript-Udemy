<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data e Hora</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body id="body">

    <section class="container">
        <p>Calculadora</p>
        <p id="conta"></p>
        <table>
            <tr>
                <td class="limpar">C</td >
                <td class="operador">(</td>
                <td class="operador">)</td>
                <td class="operador">/</td>
            </tr>
            <tr>
                <td class="operador">7</td>
                <td class="operador">8</td>
                <td class="operador">9</td>
                <td class="operador">*</td>
            </tr>
            <tr>
                <td class="operador">4</td>
                <td class="operador">5</td>
                <td class="operador">6</td>
                <td class="operador">+</td>
            </tr>
            <tr>
                <td class="operador">1</td>
                <td class="operador">2</td>
                <td class="operador">3</td>
                <td class="operador">-</td>
            </tr>
            <tr>
                <td class="operador">.</td>
                <td class="operador">0</td>
                <td class="backspace">&laquo;</td>
                <td class="total">=</td>
            </tr>
        </table>
    </section>


    <script src="./assets/js/main.js"></script>
</body>

</html>
